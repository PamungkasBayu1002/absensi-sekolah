<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMKN RESTORASI PULAU KOMODO - ABSENSI</title>
    <!-- Pustaka Pengenalan Wajah & Ekspor Excel -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script defer src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-transform: uppercase; }
        body { margin: 0; background-color: #0c192c; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
        
        /* Header dengan Tema Logo (Biru & Emas) */
        header { background-color: #0f172a; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #facc15; }
        .header-brand { display: flex; align-items: center; gap: 15px; }
        .school-logo { width: 50px; height: 50px; object-fit: contain; border-radius: 50%; background: white; padding: 2px; border: 2px solid #facc15; }
        header h1 { margin: 0; font-size: 1.3rem; color: #38bdf8; letter-spacing: 1px; }
        header p { margin: 0; font-size: 0.75rem; color: #facc15; font-weight: bold; }
        .clock { font-size: 1.3rem; font-weight: bold; color: #facc15; background: #1e293b; padding: 5px 15px; border-radius: 8px; border: 1px solid #334155; }

        /* Layout Layar Lebar */
        main { display: flex; flex: 1; padding: 20px; gap: 20px; overflow: hidden; }
        
        /* Kolom Kiri: Kamera */
        .camera-section { flex: 1.3; background: #1e293b; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border: 1px solid #334155; }
        .video-wrapper { position: relative; width: 100%; max-width: 720px; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 3px solid #facc15; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .status-banner { margin-top: 15px; padding: 12px 25px; border-radius: 8px; font-size: 1.05rem; font-weight: bold; text-align: center; width: 100%; max-width: 720px; background: #334155; letter-spacing: 0.5px; border: 1px solid #475569; }
        .status-success { background: #16a34a !important; color: white; border-color: #22c55e !important; }
        .status-loading { background: #ca8a04 !important; color: white; }

        /* Kolom Kanan: Panel Kontrol & Riwayat */
        .control-section { flex: 1; background: #1e293b; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; border: 1px solid #334155; }
        .tabs { display: flex; gap: 10px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #334155; color: white; font-size: 0.85rem; font-weight: bold; cursor: pointer; border: 1px solid #475569; }
        .tab-btn.active { background: #0284c7; border-color: #38bdf8; color: #f8fafc; }

        .panel { display: none; flex-direction: column; gap: 15px; flex: 1; }
        .panel.active { display: flex; }

        /* Form Pendaftaran & Tombol Tema Emas/Biru */
        input, select, button.action-btn { padding: 12px; border-radius: 8px; border: 1px solid #475569; font-size: 0.9rem; }
        input, select { background: #0f172a; color: white; }
        input:focus, select:focus { border-color: #facc15; outline: none; }
        button.action-btn { background: #eab308; color: #0f172a; border: none; font-weight: bold; cursor: pointer; }
        button.action-btn:hover { background: #ca8a04; }
        button.excel-btn { background: #059669; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        button.excel-btn:hover { background: #047857; }
        button.danger-btn { background: #dc2626; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }

        /* Tabel Kehadiran */
        .table-container { flex: 1; overflow-y: auto; background: #0f172a; border-radius: 8px; padding: 10px; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; }
        th { color: #facc15; position: sticky; top: 0; background: #0f172a; font-weight: bold; }
    </style>
</head>

    }, 1000);

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(`panel-${tabName}`).classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', async () => {
        await loadModels();
        await startCamera();
        loadUsersFromStorage();
        renderAttendanceTable();
    });

    async function loadModels() {
        try {
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
            ]);
            statusBanner.innerText = "SISTEM SIAP! SILAKAN HADAPKAN WAJAH KE KAMERA.";
            statusBanner.classList.remove('status-loading');
        } catch (err) {
            statusBanner.innerText = "GAGAL MEMUAT MODEL AI. PASTIKAN TERHUBUNG INTERNET PADA AWAL PEMBUKAAN.";
            console.error(err);
        }
    }

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
            video.srcObject = stream;
        } catch (err) {
            statusBanner.innerText = "KAMERA TIDAK TERDETEKSI ATAU IZIN DITOLAK!";
        }
    }

    video.addEventListener('play', () => {
        const displaySize = { width: video.clientWidth, height: video.clientHeight };
        faceapi.matchDimensions(overlay, displaySize);

        setInterval(async () => {
            if (!video.videoWidth) return;
            const currentSize = { width: video.clientWidth, height: video.clientHeight };
            faceapi.matchDimensions(overlay, currentSize);

            const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
            const resizedDetections = faceapi.resizeResults(detections, currentSize);
            
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            if (faceMatcher && resizedDetections.length > 0) {
                const results = resizedDetections.map(d => faceMatcher.findBestMatch(d.descriptor));
                results.forEach((result, i) => {
                    const box = resizedDetections[i].detection.box;
                    const drawBox = new faceapi.draw.DrawBox(box, { label: result.toString() });
                    drawBox.draw(overlay);

                    if (result.label !== 'unknown') {
                        processAttendance(result.label);
                    }
                });
            } else {
                faceapi.draw.drawDetections(overlay, resizedDetections);
            }
        }, 800);
    });

    async function registerFace() {
        const name = document.getElementById('regName').value.trim().toUpperCase();
        const role = document.getElementById('regRole').value;
        const info = document.getElementById('regInfo').value.trim().toUpperCase();

        if (!name) return alert("NAMA WAJIB DIISI!");

        statusBanner.innerText = "MEMINDAI WAJAH UNTUK PENDAFTARAN...";
        const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();

        if (!detection) {
            statusBanner.innerText = "WAJAH TIDAK TERDETEKSI! PASTIKAN CAHAYA CUKUP.";
            return;
        }

        const users = JSON.parse(localStorage.getItem('face_users') || '[]');
        users.push({
            id: Date.now(),
            name: name,
            role: role,
            info: info,
            descriptor: Array.from(detection.descriptor)
        });

        localStorage.setItem('face_users', JSON.stringify(users));
        document.getElementById('regName').value = '';
        document.getElementById('regInfo').value = '';
        
        loadUsersFromStorage();
        statusBanner.innerText = `BERHASIL MENDAFTARKAN: ${name}`;
        alert(`DATA WAJAH ${name} BERHASIL DISIMPAN!`);
    }

    function loadUsersFromStorage() {
        const users = JSON.parse(localStorage.getItem('face_users') || '[]');
        const tbody = document.getElementById('usersTable');
        tbody.innerHTML = '';

        if (users.length === 0) {
            faceMatcher = null;
            return;
        }

        labeledFaceDescriptors = users.map(u => {
            tbody.innerHTML += `
                <tr>
                    <td>${u.name}</td>
                    <td>${u.role}</td>
                    <td>${u.info}</td>
                    <td><button class="danger-btn" onclick="deleteUser(${u.id})">HAPUS</button></td>
                </tr>
            `;
            return new faceapi.LabeledFaceDescriptors(u.name, [new Float32Array(u.descriptor)]);
        });

        faceMatcher = new faceapi.FaceMatcher(labeledFaceDescriptors, 0.45);
    }

    function deleteUser(id) {
        if (!confirm("HAPUS DATA WAJAH INI?")) return;
        let users = JSON.parse(localStorage.getItem('face_users') || '[]');
        users = users.filter(u => u.id !== id);
        localStorage.setItem('face_users', JSON.stringify(users));
        loadUsersFromStorage();
    }

    function processAttendance(name) {
        const now = Date.now();
        if (recentScans[name] && (now - recentScans[name] < 60000)) return;
        recentScans[name] = now;

        const users = JSON.parse(localStorage.getItem('face_users') || '[]');
        const userDetail = users.find(u => u.name === name) || { role: 'SISWA', info: '-' };

        const dateObj = new Date();
        const tanggal = dateObj.toLocaleDateString('id-ID');
        const jam = dateObj.toLocaleTimeString('id-ID');

        let logs = JSON.parse(localStorage.getItem('attendance_logs') || '[]');
        let existingLog = logs.find(l => l.tanggal === tanggal && l.nama === name);

        if (!existingLog) {
            logs.unshift({
                tanggal: tanggal,
                nama: name,
                peran: userDetail.role,
                masuk: jam,
                pulang: '-'
            });
            statusBanner.innerText = `✅ ABSEN MASUK BERHASIL: ${name} (${jam})`;
            statusBanner.classList.add('status-success');
        } else if (existingLog.pulang === '-') {
            existingLog.pulang = jam;
            statusBanner.innerText = `🏠 ABSEN PULANG BERHASIL: ${name} (${jam})`;
            statusBanner.classList.add('status-success');
        } else {
            statusBanner.innerText = `ℹ️ ${name} SUDAH ABSEN LENGKAP HARI INI.`;
            return;
        }

        localStorage.setItem('attendance_logs', JSON.stringify(logs));
        renderAttendanceTable();

        setTimeout(() => {
            statusBanner.classList.remove('status-success');
            statusBanner.innerText = "SISTEM SIAP! SILAKAN HADAPKAN WAJAH KE KAMERA.";
        }, 4000);
    }

    function renderAttendanceTable() {
        const logs = JSON.parse(localStorage.getItem('attendance_logs') || '[]');
        const tbody = document.getElementById('attendanceTable');
        tbody.innerHTML = logs.map(log => `
            <tr>
                <td>${log.tanggal}</td>
                <td><strong>${log.nama}</strong></td>
                <td>${log.peran}</td>
                <td style="color: #4ade80;">${log.masuk}</td>
                <td style="color: #f87171;">${log.pulang}</td>
            </tr>
        `).join('');
    }

    function clearAttendance() {
        if (!confirm("HAPUS SEMUA RIWAYAT ABSENSI?")) return;
        localStorage.removeItem('attendance_logs');
        renderAttendanceTable();
    }

    function exportToExcel() {
        const logs = JSON.parse(localStorage.getItem('attendance_logs') || '[]');
        if (logs.length === 0) return alert("BELUM ADA DATA ABSENSI UNTUK DIEKSPOR!");

        const worksheet = XLSX.utils.json_to_sheet(logs);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "REKAP ABSENSI");

        const fileName = `REKAP_ABSENSI_SMKN_RESTORASI_${new Date().toISOString().slice(0,10)}.xlsx`;
        XLSX.writeFile(workbook, fileName);
    }
</script>
